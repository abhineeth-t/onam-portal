<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #070B19;
      background-image: 
        linear-gradient(rgba(7, 11, 25, 0.78), rgba(7, 11, 25, 0.85)),
        url("https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?auto=format&fit=crop&w=2000&q=85");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #F3ECE0;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 0 16px 50px;
      position: relative;
    }

    /* Floating Festive Decorative Corners */
    body::before {
      content: "";
      position: fixed;
      top: -20px;
      left: -20px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -30px;
      right: -30px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.22) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header, .hero, .grid, .modal {
      position: relative;
      z-index: 1;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    }
    .brand-box { display: flex; flex-direction: column; }
    .brand { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 800; color: #fff; line-height: 1.2; letter-spacing: 0.5px; }
    .brand span { color: #D4AF37; text-shadow: 0 0 12px rgba(212, 175, 55, 0.6); }
    .brand-sub { font-size: 11px; color: #E5C358; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    
    .hero { text-align: center; max-width: 650px; margin: 32px auto 28px; }
    .hero h1 { 
      font-family: 'Cinzel', serif; 
      font-size: clamp(26px, 4vw, 38px); 
      margin-bottom: 8px; 
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.3); 
    }
    .hero h1 span { color: #D4AF37; }
    .hero p { color: #CBD5E1; font-size: 14px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: rgba(10, 15, 30, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 15px rgba(212, 175, 55, 0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title i { color: #D4AF37; }
    .card-sub { font-size: 12px; color: #A0AEC0; margin-bottom: 18px; }
    
    .form-group { margin-bottom: 13px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #E5C358; margin-bottom: 5px; letter-spacing: 0.5px; }
    
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(3, 5, 12, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus { border-color: #D4AF37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }

    /* Custom File Upload Box */
    .file-dropzone {
      position: relative;
      border: 1.5px dashed rgba(212, 175, 55, 0.5);
      background: rgba(3, 5, 12, 0.8);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .file-dropzone:hover { border-color: #D4AF37; background: rgba(212,175,55,0.08); }
    .file-dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .file-dropzone-text { font-size: 12px; color: #E2E8F0; }
    .file-dropzone-text i { font-size: 20px; color: #D4AF37; display: block; margin-bottom: 6px; }
    .file-chosen-name { font-size: 11px; color: #4ADE80; margin-top: 4px; font-weight: 600; display: none; }

    .qr-container {
      background: rgba(3, 5, 12, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .qr-container img { width: 95px; height: 95px; background: #fff; padding: 4px; border-radius: 6px; }
    .qr-text { font-size: 11px; color: #A0AEC0; }
    .qr-text code { display: block; color: #D4AF37; font-weight: 700; margin: 3px 0; user-select: all; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s ease, filter 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-gold { background: linear-gradient(135deg, #D4AF37, #B8860B); color: #070B19; box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3); }
    .btn-orange { background: linear-gradient(135deg, #FF6B35, #D64F1C); color: #fff; box-shadow: 0 4px 14px rgba(255, 107, 53, 0.3); }
    
    .alert { display: none; padding: 10px; background: rgba(0,200,83,0.18); border: 1px solid #00C853; border-radius: 8px; color: #4ADE80; font-size: 12px; margin-bottom: 12px; text-align: center; }
    
    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: rgba(12, 18, 37, 0.95);
      border: 2px solid #D4AF37;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.25);
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }
    .ticket-qr { margin: 14px auto; background: #fff; padding: 10px; display: inline-block; border-radius: 8px; }
  </style>
